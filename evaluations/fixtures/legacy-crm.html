<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy CRM review fixture — synthetic data</title>
<style>
body { margin:0; min-width:1000px; overflow:hidden; font:14px system-ui; color:#222; }
header { padding:24px; border-bottom:1px solid #ddd; }
main { padding:24px; }
.toolbar { display:flex; gap:8px; margin-bottom:20px; }
table { border-collapse:collapse; width:100%; }
td,th { padding:14px; border-bottom:1px solid #eee; text-align:left; }
button { cursor:pointer; }
#editor { position:fixed; inset:100px 20% auto; background:white; border:1px solid #999; padding:32px; display:none; }
input { padding:8px; }
.notice { color:#aaa; }
</style>
<header><h1>Contacts</h1><span class="notice">Synthetic evaluation fixture; intentionally incomplete.</span></header>
<main>
<div class="toolbar"><input id="search" placeholder="Search"><select id="owner"><option value="">All owners</option><option>Amina</option><option>Marc</option></select><button id="clear">Clear</button></div>
<p id="count"></p>
<table><thead><tr><th>Name</th><th>Company</th><th>Owner</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<p><button id="prev">Previous</button> <span id="page"></span> <button id="next">Next</button></p>
<p id="status"></p>
</main>
<div id="editor"><h2>Edit contact</h2><form id="form"><input id="name" required><input id="company"><label><input id="reject" type="checkbox">Simulate failed save</label><button>Save</button><button type="button" id="close">Close</button></form><p id="error"></p></div>
<script>
const contacts = [
{id:1,name:'Amina Njoya',company:'Atelier Horizon',owner:'Amina'},
{id:2,name:'Marc Dubois',company:'Maison des Services',owner:'Marc'},
{id:3,name:'Clara Ndom',company:'Bright Field',owner:'Amina'},
{id:4,name:'Gabriel Essomba',company:'Northern Partners',owner:'Marc'},
{id:5,name:'Salma Bello',company:'Nouvelle Agence',owner:'Amina'},
{id:6,name:'Jean Kouam',company:'Long Company Name With Multiple Divisions',owner:'Marc'},
{id:7,name:'Mireille Fopa',company:'',owner:'Amina'}
];
let page=0, selected=null;
const el=id=>document.getElementById(id);
function render() {
  const matches=contacts.filter(c=>(!el('owner').value||c.owner===el('owner').value)&&c.name.toLowerCase().includes(el('search').value.toLowerCase()));
  el('count').textContent=contacts.length+' matching contacts';
  el('page').textContent='Page '+(page+1);
  el('rows').innerHTML=matches.slice(page*3,page*3+3).map(c=>`<tr><td>${c.name}</td><td>${c.company}</td><td>${c.owner}</td><td><button onclick="edit(${c.id})">⋯</button></td></tr>`).join('');
}
function edit(id) { selected=contacts.find(c=>c.id===id); el('name').value=selected.name; el('company').value=selected.company; el('editor').style.display='block'; }
el('search').oninput=render;
el('owner').onchange=render;
el('clear').onclick=()=>{el('search').value='';el('owner').value='';render();};
el('next').onclick=()=>{page++;render();};
el('prev').onclick=()=>{page=Math.max(0,page-1);render();};
el('close').onclick=()=>el('editor').style.display='none';
el('form').onsubmit=e=>{
  e.preventDefault(); const draft={name:el('name').value,company:el('company').value}; const rejected=el('reject').checked;
  el('status').textContent='Saved'; el('form').reset();
  if(rejected) {el('error').textContent='Save failed. Try again.';return;}
  Object.assign(selected,draft); el('editor').style.display='none'; render();
};
render();
</script>
</html>

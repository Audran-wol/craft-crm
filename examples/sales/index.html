select[data-customized]{display:none!important}
.dropdown-trigger{display:inline-flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;min-height:44px;padding:10px 12px 10px 14px;border:1px solid #a7b0b9;border-radius:7px;background:#fff;box-shadow:0 1px 2px #202a3605;line-height:1.4;font-weight:500;min-width:0;color:var(--ink);cursor:pointer}

.dropdown-popover{position:fixed;inset:auto;margin:0;padding:6px;border:1px solid #bcc7d0;border-radius:10px;background:#fff;color:var(--ink);box-shadow:0 12px 36px #172b3a26,0 2px 6px #172b3a12;z-index:40;overflow:hidden;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:left;box-sizing:border-box;max-width:calc(100vw - 16px)}
.dropdown-popover::backdrop{background:transparent}
.dropdown-caption{padding:9px 10px 10px;font-size:10px;font-weight:700;line-height:1.3;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);overflow-wrap:anywhere}
.dropdown-list{overflow-y:auto;overscroll-behavior:contain;scroll-padding:5px;min-height:0;padding:2px;outline:none;scrollbar-width:thin;scrollbar-color:#a5b2bd transparent}

.dropdown-option[aria-disabled="true"]{opacity:.5;cursor:default}
.dropdown-check{display:flex;flex:none;width:18px;color:var(--accent);visibility:hidden}

.dropdown-search-wrap{padding:0 4px 8px;border-bottom:1px solid #e5e9ed;margin-bottom:4px}

  activeDropdown={backing,trigger,panel,list,empty,search,options,query:'',active:position==='first'?0:position==='last'?options.length-1:selected,buffer:'',typedAt:0};
  // Being a descendant of the modal preserves its focus boundary. The Popover
  // API promotes the menu above dialog clipping; fixed positioning is the fallback.
  (trigger.closest('dialog[open]')||document.body).append(panel);
  if(typeof panel.showPopover==='function')panel.showPopover();
  trigger.setAttribute('aria-expanded','true');renderDropdownOptions();
  (search||list).focus({preventScroll:true});setDropdownActive(activeDropdown.active);
  if(character){if(search){search.value=character;activeDropdown.query=character;activeDropdown.active=0;renderDropdownOptions()}else dropdownTypeahead(character)}
  panel.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeDropdown(true)}
    else if(event.key==='Tab')dropdownTab(event);
    else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();moveDropdown(event.key==='ArrowDown'?1:-1)}
    else if(event.key==='Home'||event.key==='End'){
      // Keep normal text-caret keys in a populated search field; Ctrl+Home/End
      // still provides list boundaries, as do Home/End on the listbox itself.
      if(event.target!==search||!search.value||event.ctrlKey){event.preventDefault();setDropdownActive(event.key==='Home'?0:dropdownOptions(activeDropdown).length-1)}
    }else if(event.key==='Enter'||(event.key===' '&&event.target!==search)){event.preventDefault();chooseDropdown(activeDropdown.active)}
    else if(!search&&event.key.length===1&&!event.ctrlKey&&!event.metaKey&&!event.altKey){event.preventDefault();dropdownTypeahead(event.key)}
  });
  if(search)search.addEventListener('input',()=>{if(activeDropdown){activeDropdown.query=search.value;activeDropdown.active=0;renderDropdownOptions()}});
}
document.addEventListener('pointerdown',event=>{if(activeDropdown&&!activeDropdown.panel.contains(event.target)&&!activeDropdown.trigger.contains(event.target))closeDropdown(true)},true);
document.addEventListener('focusin',event=>{if(activeDropdown&&!activeDropdown.panel.contains(event.target)&&!activeDropdown.trigger.contains(event.target))closeDropdown(false)});
window.addEventListener('resize',placeDropdown);

window.visualViewport?.addEventListener('resize',placeDropdown);
window.visualViewport?.addEventListener('scroll',placeDropdown);

function rememberRerenderFocus(){
  const node=activeDropdown?.trigger||document.activeElement;if(!node||node===document.body)return null;
  const token={node,id:node.id||'',attrs:{}};
  for(const name of ['data-nav','data-clear','data-page','data-activity-view','data-action','data-stage','data-toggle','href'])if(node.hasAttribute(name))token.attrs[name]=node.getAttribute(name);
  return token;
}
function restoreRerenderFocus(token){
  if(!token||token.node.isConnected)return;
  let target=token.id?document.getElementById(token.id):null;
  if(!target){
    const entries=Object.entries(token.attrs);
    if(entries.length)target=Array.from(document.querySelectorAll('button,select,a')).find(node=>!node.disabled&&entries.every(([name,value])=>node.getAttribute(name)===value));
  }
  if(!target&&token.attrs['data-clear'])target=document.getElementById(token.attrs['data-clear']==='q'?'search':'filter-'+token.attrs['data-clear']);
  if(!target&&token.attrs['data-action']==='reset')target=document.getElementById('search');
  if(!target&&token.attrs['data-page'])target=document.getElementById('list-page-status');
  if(!target)target=document.querySelector('nav button.active');
  target?.focus();
}
function shell(){const token=rememberRerenderFocus();closeDropdown(false);shellRender();enhanceDropdowns();paintStorageWarning();restoreRerenderFocus(token)}
function renderPage(){const token=rememberRerenderFocus();closeDropdown(false);renderPageContent();enhanceDropdowns();restoreRerenderFocus(token)}
function renderResults(){const token=rememberRerenderFocus();closeDropdown(false);renderResultsContent();enhanceDropdowns();restoreRerenderFocus(token)}
function shellRender(){document.documentElement.lang=ui.lang;document.title=`Atelier · ${t(ui.page)}`;document.querySelector('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark" aria-hidden="true"></span>atelier<span style="font-weight:400">/</span></div><p class="workspace">${t('workspace')}</p><nav aria-label="Navigation">${['contacts','companies','opportunities','activities'].map((v,i)=>`<button data-nav="${v}" ${ui.page===v?'aria-current="page" class="active"':''}><span class="n" aria-hidden="true">0${i+1}</span>${t(v)}</button>`).join('')}</nav><div class="aside-foot"><small>ATELIER AGENCY<br>Douala · Remote</small><div class="user"><span class="avatar">ML</span><div>Maya Laurent<br><small>Account manager</small></div></div></div></aside><main class="main"><div class="topline"><span>${t('synthetic')}</span><select class="locale" id="locale" aria-label="${t('interfaceLanguage')}"><option value="fr" ${ui.lang==='fr'?'selected':''}>Français</option><option value="en" ${ui.lang==='en'?'selected':''}>English</option></select></div><div id="storage-warning" class="banner" role="alert"></div><div class="heading"><div><h1>${t(ui.page)}</h1><p>${t(ui.page==='contacts'?'desc':ui.page==='companies'?'companiesDesc':ui.page==='opportunities'?'oppsDesc':'activitiesDesc')}</p></div>${ui.page==='contacts'?`<button class="primary" data-action="create">+ ${t('addContact')}</button>`:ui.page==='activities'?`<button class="primary" data-action="add-activity">+ ${t('addActivity')}</button>`:''}</div><div id="controls"></div><div id="work"></div><div class="notice">${t('boundary')}<details><summary>${t('demoTools')}</summary><button class="small" data-action="fail">${t('failNext')}</button>${recordStore.state.originalRaw!==null?`<button class="small" data-action="storage-source">${t('storageSource')}</button>`:''}</details></div></main></div>`;renderPage()}
function renderPageContent(){let controls=document.querySelector('#controls');if(ui.page==='contacts'){controls.innerHTML=`<div class="view"><span>${t('allContacts')}</span><small>${t('local')}</small></div><div class="toolbar"><label class="search">${t('search')}<input id="search" type="search" placeholder="${t('searchHint')}" value="${esc(ui.q)}"></label><label>${t('status')}<select id="filter-status"><option value="">${t('all')}</option>${options(['client','prospect','partner'],ui.status)}</select></label><label>${t('owner')}<select id="filter-owner"><option value="">${t('all')}</option>${options(['Maya','Alex'],ui.owner,false)}</select></label><label>${t('language')}<select id="filter-language"><option value="">${t('all')}</option><option value="fr" ${ui.language==='fr'?'selected':''}>Français</option><option value="en" ${ui.language==='en'?'selected':''}>English</option></select></label></div>`}else if(ui.page==='activities'){controls.innerHTML=`<div class="view"><button class="quiet" data-activity-view="open" ${activityView==='open'?'aria-pressed="true" style="border-bottom:3px solid var(--accent);border-radius:0;font-weight:650"':'aria-pressed="false"'}>${t('open')} (${db.activities.filter(a=>!a.done).length})</button><button class="quiet" data-activity-view="done" aria-pressed="${activityView==='done'}" ${activityView==='done'?'style="border-bottom:3px solid var(--accent);border-radius:0;font-weight:650"':''}>${t('done')} (${db.activities.filter(a=>a.done).length})</button></div>`}else controls.innerHTML='';renderResults()}
function matches(){return db.contacts.filter(c=>(!ui.q||normalize([c.name,c.email,companyName(c.company)].join(' ')).includes(normalize(ui.q)))&&(!ui.status||c.status===ui.status)&&(!ui.owner||c.owner===ui.owner)&&(!ui.language||c.language===ui.language)).sort((a,b)=>(a.name.localeCompare(b.name,locale())*(ui.sort==='asc'?1:-1))||a.id.localeCompare(b.id))}
function renderResultsContent(){const work=document.querySelector('#work');if(ui.page==='contacts'){let list=matches(),totalPages=Math.max(1,Math.ceil(list.length/6));ui.p=Math.min(Math.max(1,ui.p),totalPages);let rows=list.slice((ui.p-1)*6,ui.p*6),active=['q','status','owner','language'].filter(k=>ui[k]);work.innerHTML=`<div class="results-meta"><span>${list.length} ${list.length===1?(ui.lang==='fr'?'contact correspondant':'matching contact'):t('matches')} · ${t('countScope')}</span><div class="scope">${active.map(k=>`<button class="filter-chip" data-clear="${k}">${esc(k==='status'?t(ui[k]):ui[k])} ×<span style="position:absolute;width:1px;height:1px;overflow:hidden"> ${t('reset')}</span></button>`).join('')}${active.length?`<button class="quiet small" data-action="reset">${t('reset')}</button>`:''}</div></div>${!list.length?`<div class="empty"><h2>${t('empty')}</h2><p>${t('emptyDesc')}</p><button data-action="reset">${t('reset')}</button></div>`:`<div class="table-wrap"><table><colgroup><col class="col-name" style="width:28%"><col class="col-company" style="width:22%"><col class="col-status" style="width:13%"><col class="col-owner" style="width:13%"><col class="col-next" style="width:24%"></colgroup><thead><tr><th scope="col" aria-sort="${ui.sort==='asc'?'ascending':'descending'}"><button class="sort-link" data-action="sort">${t('name')} ${ui.sort==='asc'?'↑':'↓'}</button></th><th scope="col" class="col-company">${t('company')}</th><th scope="col">${t('status')}</th><th scope="col" class="col-owner">${t('owner')}</th><th scope="col" class="col-next">${t('next')}</th></tr></thead><tbody>${rows.map(c=>{let a=nextActivity(c.id);return `<tr><td><div class="identity"><span class="avatar" aria-hidden="true">${esc(initials(c.name))}</span><div><a href="#contact=${c.id}">${esc(c.name)}</a><small>${esc(c.role||c.email)}</small><div class="mobile-activity">${esc(companyName(c.company))}<br>${dateLabel(a)}</div></div></div></td><td class="col-company">${esc(companyName(c.company))}<small style="display:block">${esc(company(c.company)?.city||'—')}</small></td><td>${badge(c)}</td><td class="col-owner">${esc(c.owner)}</td><td class="col-next">${dateLabel(a)}<small style="display:block;margin-top:4px">${esc(a?.title||'')}</small></td></tr>`}).join('')}</tbody></table></div>`}<div class="footer"><span>${list.length?`${(ui.p-1)*6+1}–${Math.min(ui.p*6,list.length)} / ${list.length}`:'0 / 0'}</span><div class="pager"><button data-page="${ui.p-1}" ${ui.p<=1?'disabled':''}>${t('previous')}</button><span id="list-page-status" tabindex="-1">${t('page')} ${ui.p} ${t('of')} ${totalPages}</span><button data-page="${ui.p+1}" ${ui.p>=totalPages?'disabled':''}>${t('nextPage')}</button></div></div>`;storeUI()}else if(ui.page==='activities'){let tasks=db.activities.filter(a=>a.done===(activityView==='done')).sort((a,b)=>a.date.localeCompare(b.date));work.innerHTML=tasks.length?`<div class="activity-list">${tasks.map(a=>`<div class="activity-row ${a.done?'done':''}"><div><h3>${esc(a.title)}</h3><p><a href="#contact=${a.contact}">${esc(person(a.contact)?.name||'—')}</a> <span class="muted">· ${esc(person(a.contact)?.owner||'—')}</span></p></div><div class="activity-date">${a.done?dateText(a.date):dateLabel(a)}</div><button data-toggle="${a.id}" aria-label="${t(a.done?'undo':'complete')}: ${esc(a.title)}">${t(a.done?'undo':'complete')}</button></div>`).join('')}</div>`:`<div class="empty"><h2>${t('noTasks')}</h2><p>${t('noTasksDesc')}</p><button data-action="add-activity">${t('addActivity')}</button></div>`}else if(ui.page==='companies'){work.innerHTML=`<div class="company-grid">${db.companies.map(co=>{const contacts=db.contacts.filter(c=>c.company===co.id);const value=db.opportunities.filter(o=>o.company===co.id&&!['won','lost'].includes(o.stage)).reduce((s,o)=>s+o.amount,0);return `<article class="company"><h2>${esc(co.name)}</h2><p class="muted">${esc(co.sector)} · ${esc(co.city)}</p><div class="line"><span>${contacts.length} ${t('contactsCount')}</span><span>${t('openValue')}: <strong>${money(value)}</strong></span></div><p>${contacts.map(c=>`<a href="#contact=${c.id}">${esc(c.name)}</a>`).join(' · ')||t('noActivity')}</p></article>`}).join('')}</div>`}else{work.innerHTML=`<div class="table-wrap"><table class="opps-table"><thead><tr><th scope="col">${t('opportunity')}</th><th scope="col">${t('company')}</th><th scope="col">${t('primaryContact')}</th><th scope="col" class="money">${t('amount')} · EUR</th><th scope="col">${t('stage')}</th></tr></thead><tbody>${db.opportunities.map(o=>`<tr><td><strong>${esc(o.name)}</strong></td><td>${esc(companyName(o.company))}</td><td><a href="#contact=${o.contact}">${esc(person(o.contact)?.name||'—')}</a></td><td class="money">${money(o.amount)}</td><td><select data-stage="${o.id}" aria-label="${t('stage')}: ${esc(o.name)}">${options(['discovery','proposal','negotiation','won','lost'],o.stage)}</select></td></tr>`).join('')}</tbody></table></div>`}}
const dialog=document.querySelector('#record');
function openDialog(){closeDropdown(false);enhanceDropdowns(dialog);if(!dialog.open){opener=document.activeElement;dialog.showModal()}dialog.scrollTop=0;setTimeout(()=>(dialog.querySelector('[autofocus]')||dialog.querySelector('[data-action="close"]'))?.focus(),0)}
function header(title,subtitle=''){return `<div class="dialog-head"><div><h2 id="dialog-title">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button class="close quiet" data-action="close" aria-label="${t('close')}">×</button></div>`}
function showRecord(id){activeId=id;dialogMode='detail';const c=person(id);if(!c){dialog.innerHTML=header(t('notFound'));openDialog();return}const acts=db.activities.filter(a=>a.contact===id&&!a.done).sort((a,b)=>a.date.localeCompare(b.date));const opps=db.opportunities.filter(o=>o.contact===id);dialog.innerHTML=header(c.name,`${c.role||c.email} · ${companyName(c.company)}`)+`<div class="dialog-body"><section><div class="section-title"><div>${badge(c)}</div><button data-action="edit">${t('edit')}</button></div><dl class="properties"><dt>${t('email')}</dt><dd><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd><dt>${t('phone')}</dt><dd>${c.phone?`<a href="tel:${esc(c.phone.replace(/\s/g,''))}">${esc(c.phone)}</a>`:t('notSet')}</dd><dt>${t('owner')}</dt><dd>${esc(c.owner)}</dd><dt>${t('language')}</dt><dd>${c.language==='fr'?'Français':'English'}</dd><dt>${t('company')}</dt><dd>${esc(companyName(c.company))}</dd></dl></section><section><div class="section-title"><h3>${t('next')}</h3><button class="small" data-action="add-related">+ ${t('activity')}</button></div>${acts.length?acts.map(a=>`<div class="related"><div><p>${esc(a.title)}</p><small>${dateLabel(a)}</small></div><button class="small" data-toggle="${a.id}" aria-label="${t('complete')}: ${esc(a.title)}">${t('complete')}</button></div>`).join(''):`<p class="muted">${t('noActivity')}</p>`}</section><section><h3>${t('relatedOpps')}</h3>${opps.length?opps.map(o=>`<div class="related"><div><p>${esc(o.name)}</p><small>${money(o.amount)} · ${t(o.stage)}</small></div></div>`).join(''):`<p class="subtle-row muted">${t('noOpp')}</p>`}</section></div>`;openDialog()}
function contactForm(id=''){dialogMode='edit';activeId=id;let c=draftMap[id||'new']||clone(person(id)||{name:'',email:'',phone:'',role:'',company:'',status:'prospect',owner:'Maya',language:ui.lang});dialog.innerHTML=header(t(id?'editContact':'newContact'),t(id?'editDesc':'contactDesc'))+`<form id="contact-form"><div class="dialog-body"><div id="form-error" class="form-error" role="alert"></div><div class="form-grid"><label class="full">${t('fullName')} · ${t('required')}<input name="name" autocomplete="name" required maxlength="120" autofocus value="${esc(c.name)}"></label><label class="full">${t('email')} · ${t('required')}<input name="email" type="email" autocomplete="email" required value="${esc(c.email)}"></label><label>${t('phone')}<input name="phone" type="tel" autocomplete="tel" value="${esc(c.phone)}"></label><label>${t('role')}<input name="role" value="${esc(c.role)}"></label><label class="full">${t('company')}<select name="company"><option value="">${t('noCompany')}</option>${db.companies.map(co=>`<option value="${co.id}" ${c.company===co.id?'selected':''}>${esc(co.name)}</option>`).join('')}</select></label><label>${t('status')}<select name="status">${options(['prospect','client','partner'],c.status)}</select></label><label>${t('owner')}<select name="owner">${options(['Maya','Alex'],c.owner,false)}</select></label><label>${t('language')}<select name="language"><option value="fr" ${c.language==='fr'?'selected':''}>Français</option><option value="en" ${c.language==='en'?'selected':''}>English</option></select></label></div><p class="draft-note">${t('draft')}</p></div><div class="dialog-actions"><button type="button" data-action="cancel-edit">${t('cancel')}</button><button class="primary" type="submit">${t('save')}</button></div></form>`;openDialog()}
function activityForm(id=''){dialogMode='activity';const key='activity-'+id,c=draftMap[key]||{title:'',date:day(1),contact:id||db.contacts[0]?.id||''};activeId=id;dialog.innerHTML=header(t('addActivity'),id?`${t('activityFor')} ${person(id)?.name}`:'')+`<form id="activity-form"><div class="dialog-body"><div id="form-error" class="form-error" role="alert"></div><div class="form-grid"><label class="full">${t('activityTitle')} · ${t('required')}<input name="title" required maxlength="200" autofocus value="${esc(c.title)}"></label><label class="full">${t('contact')}<select name="contact" required>${db.contacts.map(p=>`<option value="${p.id}" data-description="${esc(p.email)}" ${p.id===c.contact?'selected':''}>${esc(p.name)} · ${esc(companyName(p.company))}</option>`).join('')}</select></label><label>${t('dueDate')} · ${t('required')}<input type="date" name="date" required value="${esc(c.date)}"></label></div><p class="draft-note">${t('draft')}</p></div><div class="dialog-actions"><button type="button" data-action="cancel-activity">${t('cancel')}</button><button class="primary" type="submit">${t('save')}</button></div></form>`;openDialog()}
function captureDraft(){const form=dialog.querySelector('form');if(form){const draft=Object.fromEntries(new FormData(form));draftMap[dialogMode==='activity'?'activity-'+activeId:activeId||'new']=draft}}
function restoreFocus(){if(opener?.isConnected){opener.focus();return}const link=activeId?document.querySelector(`a[href="#contact=${activeId}"]`):null;(link||document.querySelector('.heading button')||document.querySelector('nav button.active'))?.focus()}
function closeDialog(){closeDropdown(false);captureDraft();dialog.close();if(location.hash)history.pushState(null,'',location.pathname+location.search);restoreFocus();dialogMode='';activeId=''}
function errorInForm(message){if(!recordStore.state.writable)message+=' '+t('storageBlocked');const el=dialog.querySelector('#form-error');el.textContent=message;el.setAttribute('tabindex','-1');el.focus()}
function toggleActivity(id){const next=clone(db),a=next.activities.find(a=>a.id===id);a.done=!a.done;if(commit(next)){announce(t(a.done?'completed':'restored'));if(ui.page==='activities'){renderPage();document.querySelector('[data-activity-view="'+activityView+'"]')?.focus()}else renderResults();if(dialog.open&&dialogMode==='detail')showRecord(activeId)}else{if(dialog.open){let e=dialog.querySelector('.dialog-body');e.insertAdjacentHTML('afterbegin',`<div class="banner" role="alert">${t('saveError')}</div>`)}else paintStorageWarning(t('saveError'));renderResults()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){ui.page=b.dataset.nav;storeUI();shell();document.querySelector('nav button.active')?.focus();return}if(b.dataset.clear){ui[b.dataset.clear]='';ui.p=1;renderPage();document.getElementById(b.dataset.clear==='q'?'search':'filter-'+b.dataset.clear)?.focus();return}if(b.dataset.page){ui.p=Number(b.dataset.page);renderResults();document.getElementById('list-page-status')?.focus();return}if(b.dataset.activityView){activityView=b.dataset.activityView;renderPage();Array.from(document.querySelectorAll('[data-activity-view]')).find(node=>node.dataset.activityView===activityView)?.focus();return}if(b.dataset.toggle){toggleActivity(b.dataset.toggle);return}switch(b.dataset.action){case'storage-retry':recoverStorage(false);break;case'storage-reset':recoverStorage(true);break;case'storage-source':downloadStorageSource();break;case'create':contactForm();break;case'close':closeDialog();break;case'edit':contactForm(activeId);break;case'cancel-edit':captureDraft();activeId?showRecord(activeId):closeDialog();break;case'cancel-activity':captureDraft();activeId?showRecord(activeId):closeDialog();break;case'add-related':activityForm(activeId);break;case'add-activity':activityForm();break;case'reset':Object.assign(ui,{q:'',status:'',owner:'',language:'',p:1});renderPage();document.getElementById('search')?.focus();break;case'sort':ui.sort=ui.sort==='asc'?'desc':'asc';renderResults();document.querySelector('[data-action="sort"]')?.focus();break;case'fail':failNext=true;announce(t('failureArmed'));break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.q=e.target.value;ui.p=1;renderResults()}if(e.target.closest('form'))captureDraft()});
document.addEventListener('change',e=>{
  const controlId=e.target.dataset.controlId||e.target.id;
  if(controlId==='locale'){ui.lang=e.target.value;storeUI();shell();focusControl('locale')}
  else if(controlId.startsWith('filter-')){ui[controlId.slice(7)]=e.target.value;ui.p=1;renderResults();focusControl(controlId)}
  else if(e.target.dataset.stage){const next=clone(db);next.opportunities.find(o=>o.id===e.target.dataset.stage).stage=e.target.value;if(commit(next)){announce(t('saved'))}else{paintStorageWarning(t('saveError'));renderResults();focusControl(controlId)}}
  if(e.target.closest('form'))captureDraft();
});
document.addEventListener('submit',e=>{if(!['contact-form','activity-form'].includes(e.target.id))return;e.preventDefault();captureDraft();const values=Object.fromEntries(new FormData(e.target)),next=clone(db);if(e.target.id==='contact-form'){values.name=values.name.trim();values.email=values.email.trim();if(!values.name||!values.email||!e.target.checkValidity()){errorInForm(t('contactRequired'));return}const id=activeId||'c'+Date.now().toString(36);const c={...values,id};const ix=next.contacts.findIndex(x=>x.id===id);ix<0?next.contacts.push(c):next.contacts[ix]=c;if(!commit(next)){errorInForm(t('saveError'));return}delete draftMap[activeId||'new'];renderResults();announce(t('saved'));if(location.hash!==`#contact=${id}`){location.hash=`contact=${id}`}else showRecord(id)}else{if(!values.title.trim()||!values.date||!person(values.contact)){errorInForm(t('activityRequired'));return}next.activities.push({...values,title:values.title.trim(),id:'a'+Date.now().toString(36),done:false});if(!commit(next)){errorInForm(t('saveError'));return}delete draftMap['activity-'+activeId];announce(t('saved'));if(ui.page==='activities')renderPage();else renderResults();activeId?showRecord(activeId):closeDialog()}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#contact=(.+)$/);if(m)showRecord(decodeURIComponent(m[1]));else if(dialog.open){closeDropdown(false);captureDraft();dialog.close();restoreFocus()}});
shell();if(location.hash.startsWith('#contact='))showRecord(decodeURIComponent(location.hash.slice(9)));
